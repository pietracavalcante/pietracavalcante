  const el=document.createElement('section');
  el.innerHTML=`<div class="sh"><div class="big">${sec.th}</div><div class="gloss">${sec.g.map(([a,b])=>`<span><b>${a}</b>${b}</span>`).join('')}</div><div class="pt">${sec.pt}</div>${sec.tip?`<div class="tip">${sec.tip}</div>`:''}</div>`;
  sec.qs.forEach((q,qi)=>{n++;const id=`q${si}_${qi}`;const d=document.createElement('div');d.className='q';
    if(sec.open){
      d.innerHTML=`<div class="stem"><span class="n">${n}.</span><span class="th" style="font-size:1.2rem">${q.s}</span></div><div class="hint">(${q.t})</div><textarea id="${id}" aria-label="Resposta ${n}"></textarea><div class="expl" hidden><b>Resposta modelo:</b> <span class="th">${q.m}</span><br>${q.mt}</div>`;
      const ta=d.querySelector('textarea');ta.value=st[id]||'';ta.oninput=()=>{st[id]=ta.value;save()};
    }else{
      d.innerHTML=`<div class="stem"><span class="n">${n}.</span>${q.s}</div><div class="opts">${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="${id}" id="${id}_${oi}" value="${oi}"${st[id]==oi?' checked':''}><span class="l">${'ABC'[oi]}</span>${o}</label>`).join('')}</div><div class="expl" hidden>${q.e}</div>`;
      d.querySelectorAll('input').forEach(i=>i.onchange=()=>{st[id]=+i.value;save()});
    }
    el.appendChild(d);});
  exam.appendChild(el);
});
document.getElementById('check').onclick=()=>{
  let ok=0,tot=0;
  S.forEach((sec,si)=>sec.qs.forEach((q,qi)=>{const id=`q${si}_${qi}`;
    if(sec.open){document.getElementById(id).parentElement.querySelector('.expl').hidden=false;return}
    tot++;const opts=[...document.querySelectorAll(`input[name="${id}"]`)];
    opts.forEach((i,oi)=>{const l=i.parentElement;l.classList.remove('right','wrong');if(oi===q.a)l.classList.add('right');else if(i.checked)l.classList.add('wrong')});
    if(st[id]===q.a)ok++;
    opts[0].closest('.q').querySelector('.expl').hidden=false;
  }));
  const s=document.getElementById('score');s.hidden=false;
  s.textContent=`Você acertou ${ok} de ${tot}. Releia as explicações das que ficaram em vermelho.`;
  s.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=()=>{st={};save();location.reload()};
</script>

</body></html>
